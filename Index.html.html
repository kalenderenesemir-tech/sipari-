<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipariş Yönetim Paneli</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Giriş Kartı Tasarımı */
        .input-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 24px;
            text-align: center;
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #4338ca;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Sipariş Listesi Tasarımı */
        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .list-header h3 {
            margin: 0;
            font-size: 20px;
        }

        .siparis-item {
            background: white;
            border-left: 6px solid var(--primary-color); /* Vurgu çizgisi */
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            font-size: 17px;
            line-height: 1.5;
            color: #334155;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="input-card">
            <h2>Yeni Sipariş</h2>
            
            <div class="input-group">
                <label>Sipariş Detayı</label>
                <input type="text" id="siparisInput" placeholder="Örn: 2 Adet Kahve...">
            </div>

            <div class="input-group">
                <label>Kim Yazıyor?</label>
                <input type="text" id="isimInput" placeholder="Adınız Soyadınız">
            </div>

            <button onclick="siparisEkle()">Siparişi Onayla</button>
        </div>

        <div class="list-header">
            <h3>Aktif Siparişler</h3>
            <span id="counter" style="background: #e2e8f0; padding: 2px 10px; border-radius: 20px; font-size: 14px;">0</span>
        </div>

        <div id="siparisListesi">
            <!-- Siparişler buraya gelecek -->
        </div>
    </div>

    <script>
        let count = 0;

        function siparisEkle() {
            const siparis = document.getElementById('siparisInput');
            const isim = document.getElementById('isimInput');
            const liste = document.getElementById('siparisListesi');
            const counterLabel = document.getElementById('counter');

            if (!siparis.value.trim() || !isim.value.trim()) {
                alert("Lütfen eksik bilgi bırakmayın.");
                return;
            }

            // Yeni dikdörtgen kutu
            const yeniKutu = document.createElement('div');
            yeniKutu.className = 'siparis-item';
            yeniKutu.innerText = siparis.value;

            // Listeye ekle (en üste)
            liste.prepend(yeniKutu);

            // Sayacı güncelle
            count++;
            counterLabel.innerText = count;

            // Alanları temizle ve odağı siparişe geri getir
            siparis.value = "";
            isim.value = "";
            siparis.focus();
        }
    </script>

</body>
</html>
